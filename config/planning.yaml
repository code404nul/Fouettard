# Réglages du module « planning perso ». Redémarrer le bot après une modification.
# Toutes les heures sont en heure de Paris. Les liens ICS sont dans le .env, jamais ici.

brief_time: "07:00"
evening_time: "21:00"

# Plage où le bot peut placer du travail, et début de la « soirée »
day_start: "08:00"
day_end: "22:00"
evening_start: "18:00"
meals:
  - ["12:30", "13:30"]
  - ["19:30", "20:15"]

zeus_refresh_minutes: 30
outlook_refresh_minutes: 60

# --- Club ---
club_weekly_goal_hours: 5      # réduit en semaine chargée, x1,5 en semaine calme
min_project_block_minutes: 60
max_project_block_minutes: 120
club_preferred_weekdays: [3]   # jeudi soir, en plus du week-end (0 = lundi)
fixed_slots: []                # ex : - {weekday: 3, start: "18:00", end: "20:00"}
protected_slots: []            # ex : - {weekday: 5, start: "09:00", end: "12:00"}

# --- J3D ---
j3d_weekly_floor_hours: 3      # temps minimal tant qu'une milestone est à venir
j3d_default_issue_hours: 2     # si l'issue n'a pas d'estimation GitLab
j3d_urgent_hours: 48           # seule urgence qui passe un jour off
j3d_stale_days: 5

# --- Révisions ---
review_minutes: 15
max_reviews_per_day: 4
exam_boost_days: 14
# Seules ces matières créent des révisions
review_subjects: [Mathématiques, Physique, Algorithmique, Architecture, Electronique, Programmation, NTS]
subject_aliases:
  maths: Mathématiques
probable_homework_subjects: [Mathématiques, Physique, Algorithmique, Programmation]

# --- Conseils de révision (courbe de l'oubli) ---
# Contrôles et partiels pris en compte jusqu'à ce nombre de jours à l'avance
exam_advice_days: 30
# Ta confiance de 1 (perdu) à 5 (je maîtrise), 3 par défaut.
# Sur Discord, « confiance maths 2 » remplace la valeur d'ici.
subject_confidence:
  Mathématiques: 3
  Physique: 3
  Algorithmique: 3
  Architecture: 3
  Electronique: 3
  Programmation: 3
  NTS: 3
  Anglais: 3
# Titre exact Zeus -> matières. Sans entrée, la matière est lue dans le titre
# (« Controle de cours de maths » -> Mathématiques), sinon toutes les matières.
exam_subjects:
  "EXAMENS SUP": [Programmation, Algorithmique]   # en salles machines : supposé être l'épreuve sur machine
# Maquette S01 (code et libellé exacts). Le poids d'une matière est la somme des coef
# de ses modules ; sans coef, le volume horaire. Ajoute « coef: 4 » quand tu les connais.
# Modules sans matière Zeus (DDRS, CDSF, méthodologie) : laissés de côté.
courses:
  - {code: 2627_I_INF_FISE_S01_AG_ACF, name: "Anglais Communication Formel", subject: Anglais, hours: "33:25"}
  - {code: 2627_I_INF_FISE_S01_PI_ADP, name: "Étude de la grammaire, Conjugaison et écriture spontanée.", subject: Anglais, hours: "33:06"}
  - {code: 2627_I_INF_FISE_S01_CN_OAC, name: "Outils d'analyse de circuits", subject: Electronique, hours: "40:00"}
  - {code: 2627_I_INF_FISE_S01_CN_PA_API, name: "Analyse : Primitives et intégrales", subject: Mathématiques, hours: "34:00"}
  - {code: 2627_I_INF_FISE_S01_CN_PA_ASF, name: "Analyse : suites et fonctions", subject: Mathématiques, hours: "100:45"}
  - {code: 2627_I_INF_FISE_S01_CN_PA_GEO, name: "Géométrie (du plan et de l'espace)", subject: Mathématiques, hours: "34:15"}
  - {code: 2627_I_INF_FISE_S01_CN_PA_SEM, name: "Séminaire", subject: Mathématiques, hours: "44:15"}
  - {code: 2627_I_INF_FISE_S01_CN_PC_APIS, name: "Analyse : primitives, intégrales, suites", subject: Mathématiques, hours: "95:00"}
  - {code: 2627_I_INF_FISE_S01_CN_PC_DP, name: "Dénombrement et probabilités", subject: Mathématiques, hours: "85:15"}
  - {code: 2627_I_INF_FISE_S01_CN_PC_OBM, name: "Outils de base mathématiques", subject: Mathématiques, hours: "52:00"}
  - {code: 2627_I_INF_FISE_S01_CN_PC_MECA, name: "Mécanique du point - Dynamique en référentiel galiléen, cinématique", subject: Physique, hours: "40:30"}
  - {code: 2627_I_INF_FISE_S01_CN_TAA, name: "Types Algébriques Abstraits", subject: Algorithmique, hours: "32:00"}
  - {code: 2627_I_INF_FISE_S01_PR_CAML, name: "Caml et récursivité", subject: Algorithmique, hours: "77:00"}
